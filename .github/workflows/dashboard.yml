name: Build & Deploy Dashboards

# Daily at 23:00 UTC (~7pm New York). Also rebuilds on every push to main
# that touches commodities/ or forex/ code, and can be triggered manually.
#
# Site layout:
#   /          → commodities dashboard (homepage)
#   /forex/    → forex monitor
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "commodities/**"
      - "forex/**"
      - "requirements.txt"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build commodities dashboard
        env:
          NO_OPEN: "1"
        run: python -m commodities.run_cmdty

      - name: Build forex dashboard
        env:
          NO_OPEN: "1"
        run: python -m forex.run_fx

      - name: Stage Pages site
        run: |
          mkdir -p _site _site/forex
          # commodities dashboard becomes the homepage
          cp $(ls -t commodities/runs/dashboard_v2_*.html | head -1) _site/index.html
          cp $(ls -t commodities/runs/signals_*.csv | head -1) _site/latest_signals.csv
          # forex monitor lives at /forex/
          cp $(ls -t forex/runs/forex_*.html | head -1) _site/forex/index.html
          cp $(ls -t forex/runs/forex_*.csv | head -1) _site/forex/latest_signals.csv

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
